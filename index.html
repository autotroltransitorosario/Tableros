<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGA · Sistema de Inspección de Gabinetes de Alumbrado by Martin Cipriani</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --navy-950:#0d1826;
  --navy-900:#122036;
  --navy-800:#1b2e4b;
  --navy-700:#2a4270;
  --steel:#5c6b85;
  --bg:#eef1f6;
  --card:#ffffff;
  --border:#dde2ea;
  --border-soft:#eceff4;
  --text:#182136;
  --text-muted:#697086;
  --red:#b93b2e;
  --red-dark:#9a2f24;
  --amber:#c68a1f;
  --green:#2f7d52;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

/* ---------- Header ---------- */
.topbar{
  background:linear-gradient(180deg,var(--navy-900),var(--navy-950));
  color:#fff;
  padding:18px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:3px solid var(--red);
  position:sticky;
  top:0;
  z-index:40;
}
.brand{display:flex;align-items:center;gap:14px;}
.brand-logo-wrap{
  background:#fff;border-radius:7px;padding:6px 10px;
  display:flex;align-items:center;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.brand-logo{
  height:26px;width:auto;display:block;
}
.brand-text{
  padding-left:14px;border-left:1px solid rgba(255,255,255,.18);
}
.brand-text h1{
  margin:0;font-size:16px;letter-spacing:.4px;font-weight:700;
}
.brand-text p{
  margin:1px 0 0;font-size:11.5px;color:#a9b3c9;letter-spacing:.2px;
}
.topbar-right{
  display:flex;align-items:center;gap:18px;font-size:12.5px;color:#a9b3c9;
}
.count-pill{
  font-family:var(--mono);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  padding:5px 12px;border-radius:20px;
  color:#e7ecf5;
}
.sync-pill{
  cursor:pointer;font-family:var(--sans);font-size:11.5px;user-select:none;
  display:flex;align-items:center;gap:6px;
}
.sync-pill:hover{background:rgba(255,255,255,.12);}
.sync-pill.err{border-color:rgba(217,101,89,.5);color:#f4c9c2;}
.sync-pill.ok{border-color:rgba(90,180,130,.4);}

/* ---------- Controls ---------- */
.controls{
  max-width:1500px;margin:22px auto 0;padding:0 28px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
}
.search-wrap{
  flex:1 1 340px;position:relative;
}
.search-wrap input{
  width:100%;padding:11px 14px 11px 38px;border:1px solid var(--border);
  border-radius:9px;background:var(--card);font-size:13.5px;color:var(--text);
  font-family:var(--sans);
}
.search-wrap input:focus{outline:2px solid var(--navy-700);outline-offset:-1px;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45;}
select.filter-select{
  padding:11px 12px;border:1px solid var(--border);border-radius:9px;
  background:var(--card);font-size:13px;color:var(--text);font-family:var(--sans);
  min-width:170px;
}
.legend{
  display:flex;gap:14px;align-items:center;font-size:12px;color:var(--text-muted);
  margin-left:auto;
}
.legend span{display:flex;align-items:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.ok{background:var(--red);}
.dot.miss{background:#c9ccd4;}

/* ---------- Table card ---------- */
.table-card{
  max-width:1500px;margin:16px auto 40px;padding:0 28px;
}
.table-scroll{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  overflow:auto;box-shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.08);
}
table{border-collapse:collapse;width:100%;min-width:1280px;font-size:13px;}
thead th{
  position:sticky;top:0;background:var(--navy-950);color:#dfe4ee;
  text-align:left;padding:12px 14px;font-weight:600;font-size:11.5px;
  letter-spacing:.35px;text-transform:uppercase;border-bottom:1px solid #000;
  white-space:nowrap;
}
tbody td{
  padding:10px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;
  color:var(--text);white-space:nowrap;
}
tbody tr:hover{background:#f7f9fc;}
tbody tr:nth-child(even){background:#fbfcfe;}
tbody tr:nth-child(even):hover{background:#f4f7fb;}

.tab-badge{
  font-family:var(--mono);font-weight:700;font-size:12.5px;
  background:var(--navy-900);color:#ffd28a;padding:4px 9px;border-radius:6px;
  letter-spacing:.3px;
}
.cell-muted{color:#b6bac5;}
.calle-cell{white-space:normal;max-width:220px;}
.calle-name{font-weight:600;}
.tipo-ubic{display:block;font-size:11px;color:var(--text-muted);margin-top:1px;}
.chip{
  font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;
  border:1px solid transparent;
}
.chip.si{background:#e8f4ec;color:var(--green);border-color:#cfe8d7;}
.chip.no{background:#fbeceb;color:var(--red-dark);border-color:#f3d4d1;}
.chip.na{background:#f0f1f4;color:#9aa0af;border-color:#e5e6ea;}

.thumb{
  width:46px;height:46px;border-radius:7px;object-fit:cover;
  border:1px solid var(--border);cursor:pointer;display:block;
  background:#f1f3f7;transition:transform .12s ease;
}
.thumb:hover{transform:scale(1.06);border-color:var(--navy-700);}
.thumb-empty{
  width:46px;height:46px;border-radius:7px;border:1px dashed var(--border);
  display:flex;align-items:center;justify-content:center;color:#c1c5cf;font-size:16px;
  background:#f7f8fa;
}

.btn-pdf{
  background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:7px;
  font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.2px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  font-family:var(--sans);
}
.btn-pdf:hover{background:var(--red-dark);}
.btn-pdf:disabled{background:#cfd3da;cursor:progress;}
.faltan{color:var(--red-dark);font-size:12px;font-weight:600;}

/* ---------- Pagination ---------- */
.pagination{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:16px 0 4px;font-size:13px;color:var(--text-muted);
}
.pagination button{
  background:var(--card);border:1px solid var(--border);border-radius:7px;
  padding:7px 14px;font-size:12.5px;cursor:pointer;color:var(--text);
  font-family:var(--sans);
}
.pagination button:disabled{opacity:.4;cursor:not-allowed;}
.pagination button:not(:disabled):hover{border-color:var(--navy-700);}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--text-muted);font-size:13.5px;
}

/* ---------- Lightbox ---------- */
.lightbox{
  position:fixed;inset:0;background:rgba(10,15,26,.86);
  display:none;align-items:center;justify-content:center;z-index:100;
  padding:40px;backdrop-filter:blur(2px);
}
.lightbox.open{display:flex;}
.lightbox-inner{
  max-width:min(90vw,900px);max-height:88vh;display:flex;flex-direction:column;align-items:center;gap:12px;
}
.lightbox-inner img{
  max-width:100%;max-height:76vh;border-radius:8px;border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff;
}
.lightbox-caption{color:#e7ecf5;font-size:13px;text-align:center;font-family:var(--sans);}
.lightbox-caption b{color:#fff;}
.lightbox-close{
  position:absolute;top:22px;right:28px;color:#fff;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.25);width:38px;height:38px;border-radius:50%;
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.lightbox-close:hover{background:rgba(255,255,255,.2);}
.lightbox-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;
  width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.lightbox-nav:hover{background:rgba(255,255,255,.2);}
.lightbox-nav.prev{left:24px;}
.lightbox-nav.next{right:24px;}
.lightbox-nav:disabled{opacity:.25;cursor:not-allowed;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--navy-950);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;
  border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:720px){
  .topbar{padding:14px 16px;}
  .controls,.table-card{padding:0 14px;}
  .legend{display:none;}
}
</style>
</head>

function driveIdFromUrl(url){
  if(!url) return null;
  url = String(url).trim();
  let m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(!m) m = url.match(/id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
function driveCandidates(url){
  const fid = driveIdFromUrl(url);
  if(!fid) return url ? [url] : [];
  return [
    `https://drive.google.com/thumbnail?id=${fid}&sz=w1600`,
    `https://lh3.googleusercontent.com/d/${fid}=w1600`,
    `https://drive.google.com/uc?export=view&id=${fid}`,
  ];
}
function cleanVal(v){
  if(v===undefined || v===null) return null;
  const s = String(v).trim();
  return s === '' ? null : s;
}
function normalizeDate(v){
  const s = cleanVal(v);
  if(!s) return null;
  // ya viene dd/mm/yyyy (formato tipico de Sheets en es-AR)
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
    const [d,m,y] = s.split('/');
    return `${d.padStart(2,'0')}/${m.padStart(2,'0')}/${y}`;
  }
  // formato yyyy-mm-dd
  let m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m2) return `${m2[3]}/${m2[2]}/${m2[1]}`;
  return s;
}
// Convierte filas crudas (ya sea del JSON estatico o del CSV) a la estructura interna comun.
function toRecord(row){
  const rec = {
    nombre: cleanVal(row['Nombre']),
    tipo: cleanVal(row['Tipo']),
    clasificacion: cleanVal(row['Clasificación'] ?? row['Clasificacion']),
    tipoUbic: cleanVal(row['Tipo de ubicación'] ?? row['Tipo de ubicacion']),
    calle: cleanVal(row['Calle']),
    altura: cleanVal(row['Altura']),
    letra: cleanVal(row['Letra']),
    bis: cleanVal(row['Bis']),
    responsable: cleanVal(row['Responsable']),
    ultimaInspeccion: normalizeDate(row['Última Inspección'] ?? row['Ultima Inspeccion']),
    lat: cleanVal(row['latitud']),
    lon: cleanVal(row['longitud']),
    cierrePuerta: cleanVal(row['Cierre Puerta']),
    id_: cleanVal(row['ID']),
    circuitoPat: cleanVal(row['Circuito con PAT']),
  };
  const planoUrl = cleanVal(row['Plano']);
  const fotoExtUrl = cleanVal(row['Foto Externa']);
  const fotoIntUrl = cleanVal(row['Foto Interna']);
  rec.planoImgs = driveCandidates(planoUrl);
  rec.fotoExtImgs = driveCandidates(fotoExtUrl);
  rec.fotoIntImgs = driveCandidates(fotoIntUrl);
  return rec;
}
// Los registros del snapshot estatico ya vienen con *Imgs calculados; los normalizamos igual por si acaso.
function normalizeStaticRow(row){
  return {
    nombre: cleanVal(row.nombre), tipo: cleanVal(row.tipo), clasificacion: cleanVal(row.clasificacion),
    tipoUbic: cleanVal(row.tipoUbic), calle: cleanVal(row.calle), altura: cleanVal(row.altura),
    letra: cleanVal(row.letra), bis: cleanVal(row.bis), responsable: cleanVal(row.responsable),
    ultimaInspeccion: normalizeDate(row.ultimaInspeccion), lat: row.lat, lon: row.lon,
    cierrePuerta: cleanVal(row.cierrePuerta), id_: cleanVal(row.id_), circuitoPat: cleanVal(row.circuitoPat),
    planoImgs: row.planoImgs && row.planoImgs.length ? row.planoImgs : driveCandidates(row.planoUrl),
    fotoExtImgs: row.fotoExtImgs && row.fotoExtImgs.length ? row.fotoExtImgs : driveCandidates(row.fotoExtUrl),
    fotoIntImgs: row.fotoIntImgs && row.fotoIntImgs.length ? row.fotoIntImgs : driveCandidates(row.fotoIntUrl),
  };
}
// Mostrar unicamente los tableros que tienen cargada la Ultima inspeccion
function filterInspected(records){
  return records.filter(r => r.ultimaInspeccion !== null && r.ultimaInspeccion !== undefined && String(r.ultimaInspeccion).trim() !== '');
}

/* ================= Populate filter dropdowns ================= */
function uniqueSorted(key){
  return [...new Set(DATA.map(d=>d[key]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'es'));
}
function populateFilterDropdowns(){
  const prevResp = respFilter.value, prevClas = clasFilter.value, prevTipo = tipoFilter.value;
  respFilter.innerHTML = '<option value="">Responsable (todos)</option>';
  clasFilter.innerHTML = '<option value="">Clasificación (todas)</option>';
  tipoFilter.innerHTML = '<option value="">Ubicación (todas)</option>';
  uniqueSorted('responsable').forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v; respFilter.appendChild(o);
  });
  uniqueSorted('clasificacion').forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v; clasFilter.appendChild(o);
  });
  uniqueSorted('tipoUbic').forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v; tipoFilter.appendChild(o);
  });
  // conservar seleccion previa si la opcion todavia existe
  if([...respFilter.options].some(o=>o.value===prevResp)) respFilter.value = prevResp;
  if([...clasFilter.options].some(o=>o.value===prevClas)) clasFilter.value = prevClas;
  if([...tipoFilter.options].some(o=>o.value===prevTipo)) tipoFilter.value = prevTipo;
}

/* ================= Helpers ================= */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dash(v){ return (v===null || v===undefined || v==='') ? '<span class="cell-muted">-</span>' : esc(v); }
function chip(v){
  if(v===null||v===undefined||v==='') return '<span class="chip na">-</span>';
  const s = String(v).toLowerCase();
  if(s==='si'||s==='sí') return '<span class="chip si">sí</span>';
  if(s==='no') return '<span class="chip no">no</span>';
  return '<span class="chip na">'+esc(v)+'</span>';
}
function fullAddress(r){
  let s = r.calle || '';
  if(r.altura) s += ' ' + r.altura;
  if(r.letra) s += ' ' + r.letra;
  if(r.bis) s += ' bis';
  return s.trim();
}

/* ================= Filtering ================= */
function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  const resp = respFilter.value;
  const clas = clasFilter.value;
  const tipo = tipoFilter.value;
  filtered = DATA.filter(r=>{
    if(resp && r.responsable !== resp) return false;
    if(clas && r.clasificacion !== clas) return false;
    if(tipo && r.tipoUbic !== tipo) return false;
    if(q){
      const hay = [r.nombre, r.calle, r.responsable, r.clasificacion, r.tipoUbic, r.altura]
        .map(x=>String(x??'').toLowerCase()).join(' | ');
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  page = 1;
  render();
}

/* ================= Render ================= */
function render(){
  totalLabel.textContent = `${filtered.length} de ${DATA.length} tableros`;
  const start = (page-1)*PAGE_SIZE;
  const pageItems = filtered.slice(start, start+PAGE_SIZE);
  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));

  if(pageItems.length===0){
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
    tbody.innerHTML = pageItems.map((r,i)=>rowHtml(r, start+i)).join('');
  }
  pageLabel.textContent = `Página ${page} de ${totalPages}`;
  prevBtn.disabled = page<=1;
  nextBtn.disabled = page>=totalPages;
}

function thumbOrEmpty(urls, dataIndex, imgKey, label){
  if(!urls || !urls.length) return '<div class="thumb-empty">–</div>';
  const encoded = esc(JSON.stringify(urls));
  return `<img class="thumb" loading="lazy" src="${esc(urls[0])}" alt="${esc(label)}"
    data-candidates='${encoded}' data-try="0"
    onerror="tryNextThumbSrc(this)"
    onclick="openLightboxFor(${dataIndex}, '${imgKey}')" data-key="${imgKey}">`;
}
function tryNextThumbSrc(img){
  const candidates = JSON.parse(img.getAttribute('data-candidates') || '[]');
  let idx = parseInt(img.getAttribute('data-try') || '0', 10) + 1;
  if(idx < candidates.length){
    img.setAttribute('data-try', String(idx));
    img.src = candidates[idx];
  } else {
    img.outerHTML = '<div class="thumb-empty">⚠</div>';
  }
}

function rowHtml(r, idx){
  const complete = !!((r.fotoExtImgs && r.fotoExtImgs.length) && (r.fotoIntImgs && r.fotoIntImgs.length));
  const actions = complete
    ? `<button class="btn-pdf" onclick="generatePdf(${idx}, this)">⬇ Generar PDF</button>`
    : `<span class="faltan">Faltan fotos</span>`;
  return `
  <tr>
    <td><span class="tab-badge">${esc(r.nombre)}</span></td>
    <td class="calle-cell">
      <span class="calle-name">${esc(fullAddress(r))}</span>
      ${r.tipoUbic ? `<span class="tipo-ubic">${esc(r.tipoUbic)}</span>` : ''}
    </td>
    <td>${dash(r.altura)}</td>
    <td>${dash(r.responsable)}</td>
    <td>${dash(r.clasificacion)}</td>
    <td>${chip(r.cierrePuerta)}</td>
    <td>${chip(r.id_)}</td>
    <td>${chip(r.circuitoPat)}</td>
    <td>${dash(r.ultimaInspeccion)}</td>
    <td>${thumbOrEmpty(r.planoImgs, idx, 'plano', 'Plano tablero '+r.nombre)}</td>
    <td>${thumbOrEmpty(r.fotoExtImgs, idx, 'ext', 'Foto externa tablero '+r.nombre)}</td>
    <td>${thumbOrEmpty(r.fotoIntImgs, idx, 'int', 'Foto interna tablero '+r.nombre)}</td>
    <td>${actions}</td>
  </tr>`;
}

  lbMeta = { tablero:r.nombre, direccion: fullAddress(r) };
  showLightboxImage();
  lightbox.classList.add('open');
}
let lbMeta = {};
function showLightboxImage(){
  const item = lbImages[lbIndex];
  lbImg.setAttribute('data-candidates', JSON.stringify(item.urls));
  lbImg.setAttribute('data-try', '0');
  lbImg.onerror = ()=>tryNextLbSrc();
  lbImg.src = item.urls[0];
  lbCaption.innerHTML = `<b>${item.label}</b> — Tablero ${esc(lbMeta.tablero)} · ${esc(lbMeta.direccion)} &nbsp; (${lbIndex+1}/${lbImages.length})`;
  lbPrev.disabled = lbIndex===0;
  lbNext.disabled = lbIndex===lbImages.length-1;
}
function tryNextLbSrc(){
  const candidates = JSON.parse(lbImg.getAttribute('data-candidates') || '[]');
  let idx = parseInt(lbImg.getAttribute('data-try') || '0', 10) + 1;
  if(idx < candidates.length){
    lbImg.setAttribute('data-try', String(idx));
    lbImg.src = candidates[idx];
  } else {
    lbImg.onerror = null;
  }
}
document.getElementById('lbClose').addEventListener('click', ()=>lightbox.classList.remove('open'));
lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) lightbox.classList.remove('open'); });
lbPrev.addEventListener('click', ()=>{ if(lbIndex>0){lbIndex--; showLightboxImage();} });
lbNext.addEventListener('click', ()=>{ if(lbIndex<lbImages.length-1){lbIndex++; showLightboxImage();} });
document.addEventListener('keydown', (e)=>{
  if(!lightbox.classList.contains('open')) return;
  if(e.key==='Escape') lightbox.classList.remove('open');
  if(e.key==='ArrowLeft' && lbIndex>0){lbIndex--; showLightboxImage();}
  if(e.key==='ArrowRight' && lbIndex<lbImages.length-1){lbIndex++; showLightboxImage();}
});

/* ================= Toast ================= */
function showToast(msg, ms=3200){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), ms);
}

/* ================= PDF generation ================= */
// Tries one URL: resolves with image data on success, or null on failure/timeout.
function loadOneImage(url){
  return new Promise((resolve)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let settled = false;
    const finish = (val)=>{ if(!settled){ settled=true; resolve(val); } };
    img.onload = ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        finish({dataUrl, w: img.naturalWidth, h: img.naturalHeight});
      }catch(e){
        // Canvas tainted by cross-origin policy (no CORS headers on source) — cannot embed pixels.
        finish(null);
      }
    };
    img.onerror = ()=>finish(null);
    img.src = url;
    setTimeout(()=>finish(null), 8000); // don't hang forever
  });
}
// Tries each candidate URL in order (thumbnail endpoint, then lh3, then uc?export=view)
// until one successfully loads and can be embedded.
async function loadImageData(urls){
  if(!urls || !urls.length) return null;
  for(const url of urls){
    const result = await loadOneImage(url);
    if(result) return result;
  }
  return null;
}

async function generatePdf(dataIndex, btnEl){
  const r = DATA[dataIndex];
  const originalLabel = btnEl.innerHTML;
  btnEl.disabled = true;
  btnEl.innerHTML = '⏳ Generando…';

  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 40;
    let y = margin;

    // ---- Header (logo) ----
    y = drawPdfHeader(doc, margin, pageW, y);

    // ---- Address / Tablero title ----
    doc.setFont('helvetica','bold');
    doc.setFontSize(13);
    doc.setTextColor(18,32,54);
    doc.text(`DIRECCIÓN: ${fullAddress(r).toUpperCase()}`, margin, y);
    const tabLabel = `TAB N°: ${r.nombre}`;
    doc.text(tabLabel, pageW - margin - doc.getTextWidth(tabLabel), y);
    y += 14;
    doc.setDrawColor(220,224,234);
    doc.line(margin, y, pageW-margin, y);
    y += 22;

    // ---- Detail fields: tabla con bordes ----
    const fields = [
      ['Responsable', r.responsable],
      ['Tipo', r.tipo],
      ['Clasificación', r.clasificacion],
      ['Tipo de ubicación', r.tipoUbic],
      ['Última inspección', r.ultimaInspeccion],
      ['Cierre puerta', r.cierrePuerta],
      ['ID', r.id_],
      ['Circuito con PAT', r.circuitoPat],
    ];
    y = drawDetailsTable(doc, margin, y, pageW - margin*2, fields);
    y += 22;

    // ---- Images: Foto externa / Foto interna, apiladas ocupando el resto de la página ----
    const [extImg, intImg] = await Promise.all([
      loadImageData(r.fotoExtImgs),
      loadImageData(r.fotoIntImgs)
    ]);

    const imgBoxW = pageW - margin*2;
    const captionH = 16;
    const gapBetween = 16;
    const availH = pageH - margin - y;
    const imgBoxH = Math.max(120, (availH - captionH*2 - gapBetween) / 2);

    doc.setFont('helvetica','bold');
    doc.setFontSize(10.5);
    doc.setTextColor(18,32,54);
    doc.text('Foto externa', margin, y + 11);
    y += captionH;
    drawPhotoBox(doc, margin, y, imgBoxW, imgBoxH, extImg, 'Foto externa');
    y += imgBoxH + gapBetween;

    doc.setFont('helvetica','bold');
    doc.setFontSize(10.5);
    doc.setTextColor(18,32,54);
    doc.text('Foto interna', margin, y + 11);
    y += captionH;
    drawPhotoBox(doc, margin, y, imgBoxW, imgBoxH, intImg, 'Foto interna');
    y += imgBoxH;

    // ---- Plano page ----
    if(r.planoImgs && r.planoImgs.length){
      const planoImg = await loadImageData(r.planoImgs);
      doc.addPage();
      let py = margin;
      py = drawPdfHeader(doc, margin, pageW, py);

      doc.setFont('helvetica','bold');
      doc.setFontSize(14);
      doc.setTextColor(18,32,54);
      doc.text('Plano', margin, py);
      py += 18;
      doc.setFont('helvetica','normal');
      doc.setFontSize(10);
      doc.setTextColor(105,112,134);
      doc.text(`Dirección: ${fullAddress(r)} | Tab N°: ${r.nombre}`, margin, py);
      py += 20;

      const planoBoxW = pageW - margin*2;
      const planoBoxH = pageH - margin - py;
      drawPhotoBox(doc, margin, py, planoBoxW, planoBoxH, planoImg, null);
    }

    doc.save(`Tablero_${r.nombre}.pdf`);
    showToast(`PDF generado: Tablero_${r.nombre}.pdf`);
  } catch(err){
    console.error(err);
    showToast('No se pudo generar el PDF. Intente nuevamente.');
  } finally {
    btnEl.disabled = false;
    btnEl.innerHTML = originalLabel;
  }
}

const LOGO_ASPECT = 425/142; // ancho/alto del logo Autotrol

function drawPdfHeader(doc, margin, pageW, y){
  const logoH = 28;
  const logoW = logoH * LOGO_ASPECT;
  doc.addImage(LOGO_DATA_URI, 'PNG', margin, y, logoW, logoH);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8.5);
  doc.setTextColor(105,112,134);
  doc.text('Sistema de Inspección de Gabinetes de Alumbrado', margin, y + logoH + 12);
  let newY = y + logoH + 20;
  doc.setDrawColor(220,224,234);
  doc.setLineWidth(1);
  doc.line(margin, newY, pageW - margin, newY);
  return newY + 22;
}

function drawDetailsTable(doc, x, y, w, fields){
  const rowH = 20;
  const labelColW = 150;
  const tableH = rowH * fields.length;
  doc.setDrawColor(222,226,234);
  doc.setLineWidth(1);
  // borde exterior
  doc.rect(x, y, w, tableH);
  // línea vertical entre columnas
  doc.line(x + labelColW, y, x + labelColW, y + tableH);
  doc.setFontSize(10.2);
  fields.forEach(([label, val], i)=>{
    const rowY = y + i*rowH;
    if(i % 2 === 1){
      doc.setFillColor(247,248,250);
      doc.rect(x, rowY, w, rowH, 'F');
      // volver a trazar bordes de la fila porque el relleno los tapa
      doc.setDrawColor(222,226,234);
      doc.rect(x, rowY, w, rowH);
      doc.line(x + labelColW, rowY, x + labelColW, rowY + rowH);
    } else if(i > 0){
      doc.line(x, rowY, x + w, rowY);
    }
    doc.setFont('helvetica','bold');
    doc.setTextColor(70,78,98);
    doc.text(label, x + 10, rowY + rowH/2 + 3.5);
    doc.setFont('helvetica','normal');
    doc.setTextColor(24,33,54);
    doc.text(val ? String(val) : '-', x + labelColW + 10, rowY + rowH/2 + 3.5);
  });
  return y + tableH;
}

function drawPhotoBox(doc, x, y, w, h, imgData, label){
  doc.setFillColor(247,248,250);
  doc.setDrawColor(226,230,238);
  doc.roundedRect(x, y, w, h, 4, 4, 'FD');
  if(imgData){
    const ratio = Math.min((w-10)/imgData.w, (h-10)/imgData.h);
    const iw = imgData.w * ratio, ih = imgData.h * ratio;
    const ix = x + (w-iw)/2, iy = y + (h-ih)/2;
    doc.addImage(imgData.dataUrl, 'JPEG', ix, iy, iw, ih);
  } else {
    doc.setFontSize(9);
    doc.setTextColor(180,184,194);
    doc.text(label ? `${label} no disponible` : 'Imagen no disponible', x + w/2, y + h/2, {align:'center'});
  }
}

/* ================= Live loading ================= */
const syncStatusEl = document.getElementById('syncStatus');
let lastSyncAt = null;
let autoRefreshTimer = null;

function setSyncStatus(mode, text){
  syncStatusEl.classList.remove('ok','err');
  if(mode) syncStatusEl.classList.add(mode);
  syncStatusEl.textContent = text;
}

function applyDataset(records, opts){
  opts = opts || {};
  DATA = filterInspected(records);
  populateFilterDropdowns();
  applyFilters(); // recalcula filtered + render()
  if(!opts.silent) showToast(opts.toastMsg || `Datos actualizados: ${DATA.length} tableros con inspección.`);
}

async function fetchCsvText(url){
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if(!text || !text.trim()) throw new Error('Respuesta vacía');
  return text;
}

async function loadFromSheet(isManual){
  setSyncStatus(null, isManual ? '🔄 Actualizando…' : '🔄 Conectando…');
  const urlsToTry = [SHEET_CSV_URL, SHEET_CSV_URL_FALLBACK];
  let lastErr = null;
  for(const url of urlsToTry){
    try{
      const csvText = await fetchCsvText(url);
      const parsed = Papa.parse(csvText, { header:true, skipEmptyLines:true });
      if(parsed.errors && parsed.errors.length && (!parsed.data || !parsed.data.length)){
        throw new Error('CSV vacío o con errores de formato');
      }
      const records = parsed.data.map(toRecord).filter(r => r.nombre); // descarta filas totalmente vacías
      if(!records.length) throw new Error('El Sheet no devolvió filas');
      lastSyncAt = new Date();
      applyDataset(records, { silent: !isManual, toastMsg: `Conectado al Google Sheet: ${records.length} tableros cargados.` });
      setSyncStatus('ok', `🟢 En vivo · ${lastSyncAt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`);
      return; // éxito, no seguimos probando otras URLs
    } catch(err){
      lastErr = err;
      console.warn('Falló la lectura desde', url, err);
    }
  }
  // Ninguna URL funcionó
  console.error('No se pudo leer el Google Sheet:', lastErr);
  setSyncStatus('err', '⚠️ Sin conexión al Sheet');
  if(DATA.length === 0){
    const records = STATIC_DATA_RAW.map(normalizeStaticRow);
    applyDataset(records, { silent: true });
    showToast(`No se pudo conectar al Google Sheet. Mostrando datos guardados del ${STATIC_SNAPSHOT_DATE}.`, 5000);
  } else if(isManual){
    showToast('No se pudo actualizar desde el Sheet. Se mantienen los datos actuales.', 4000);
  }
}

document.getElementById('syncStatus').addEventListener('click', ()=>loadFromSheet(true));

if(AUTO_REFRESH_MINUTES > 0){
  autoRefreshTimer = setInterval(()=>loadFromSheet(false), AUTO_REFRESH_MINUTES * 60 * 1000);
}

/* ================= Init ================= */
loadFromSheet(false);
